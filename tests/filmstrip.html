<!doctype html>
<meta charset="utf-8">
<title>Filmstrip</title>
<style>body{margin:0;background:#666;display:flex;flex-wrap:wrap;gap:4px;padding:4px}
figure{margin:0;position:relative}iframe{width:360px;height:250px;border:0;display:block}
figcaption{position:absolute;left:6px;top:4px;font:600 13px system-ui;background:#fff;padding:0 4px;border-radius:4px}</style>
<body>
<script>
/* Shows the same pattern frozen at a row of moments, to check the motion by eye.
   Example: /tests/filmstrip.html?p=1234&b=3&from=0&step=0.1&count=12 */
const q = new URLSearchParams(location.search);
const from = parseFloat(q.get('from') || '0'), step = parseFloat(q.get('step') || '0.1'), count = parseInt(q.get('count') || '12', 10);
for (let i = 0; i < count; i++) {
  const t = (from + i * step).toFixed(3);
  const fig = document.createElement('figure');
  const f = document.createElement('iframe');
  f.src = '../index.html?paused=1&t=' + t + '&p=' + (q.get('p') || '1234') + '&b=' + (q.get('b') || '3') + (q.get('start') ? '&start=' + q.get('start') : '');
  f.onload = () => {
    const d = f.contentDocument;
    const s = d.createElement('style');
    s.textContent = 'h1,.strip,.info,.controls{display:none!important}.app{min-height:0!important;padding:4px 4px 12px!important}';
    d.head.appendChild(s);
  };
  const cap = document.createElement('figcaption'); cap.textContent = 't = ' + t;
  fig.append(f, cap); document.body.appendChild(fig);
}
</script>
