<!doctype html>
<meta charset="utf-8">
<title>Rule checks</title>
<pre id="out">running</pre>
<script>
/* Loads the rules out of ../index.html and checks them for every listed pattern with 1 to 9 balls.
   Serve the project folder (python3 -m http.server) and open /tests/test.html. */
(async function () {
  const out = document.getElementById('out');
  const lines = [];
  let failures = 0;
  function fail(msg) { failures++; if (failures <= 25) lines.push('FAIL ' + msg); }

  try {
    const html = await (await fetch('../index.html')).text();
    const code = html.match(/<script id="engine">([\s\S]*?)<\/script>/)[1];
    const JLS = new Function(code + '; return JLS;')();

    const patterns = [];
    JLS.CATALOGUE.forEach(g => g.items.forEach(it => patterns.push(it)));
    ['1212', '13', '1425', '162534', '121212343434'].forEach(p => patterns.push(['extra', p]));

    // every listed pattern must be valid, start on lane 1, and appear once
    const seen = new Set();
    for (const [name, text] of patterns) {
      const pat = JLS.parse(text);
      if (!pat.ok) fail(name + ' ' + text + ' does not parse: ' + pat.error);
      if (text[0] !== '1') fail(name + ' ' + text + ' does not start on lane 1');
      if (seen.has(text)) fail(text + ' is listed twice');
      seen.add(text);
    }
    // things that must be refused
    for (const bad of ['', '123', '1223', '1731', '12a4', '1'.repeat(26), '1221']) {
      if (JLS.parse(bad).ok) fail('"' + bad + '" should be refused');
    }

    let checks = 0;
    for (const [name, text] of patterns) {
      const pat = JLS.parse(text);
      if (!pat.ok) continue;
      const L = pat.seq.length;
      for (let n = 1; n <= JLS.MAX_BALLS; n++) {
        const tag = text + ' with ' + n + ': ';
        const tm = JLS.timing(n);
        if (Math.abs(tm.roll + tm.hold - n / 2) > 1e-9) fail(tag + 'roll + hold is not n/2');
        if (!(tm.hold < 0.6 && tm.hold > 0.05 && tm.roll > 0.2)) fail(tag + 'odd timing ' + JSON.stringify(tm));

        const prev = new Map();          // ball id -> last seen state
        const rollOrder = [];            // lanes in the order rolls begin
        const step = 0.01;
        const span = Math.max(3 * L, 2 * n * L / 2 + 4);
        for (let k = 0; k * step < span; k++) {
          const u = -1.37 + k * step + 0.0031;
          const bs = JLS.balls(u, pat, n, tm);
          const hs = JLS.hands(u, pat, n, tm);
          checks++;
          if (bs.length !== n) { fail(tag + bs.length + ' balls at u=' + u); break; }
          if (new Set(bs.map(b => b.id)).size !== n) { fail(tag + 'duplicate ball ids at u=' + u); break; }
          for (let h = 0; h < 2; h++) {
            const held = bs.filter(b => b.state === 'carry' && b.hand === h);
            if (held.length > 1) { fail(tag + 'hand ' + h + ' holds ' + held.length + ' balls at u=' + u); break; }
            const hand = hs[h];
            if ((hand.state === 'carry') !== (held.length === 1)) { fail(tag + 'hand ' + h + ' and its ball disagree at u=' + u); break; }
            if (held.length === 1) {
              const b = held[0];
              if (b.from !== hand.from || b.to !== hand.to || Math.abs(b.p - hand.p) > 1e-6) { fail(tag + 'hand ' + h + ' is not where its ball is at u=' + u); break; }
            }
          }
          for (const b of bs) {
            if (b.state === 'roll') {
              if (pat.hand[b.lane] !== b.hand) fail(tag + 'lane ' + b.lane + ' rolled by the wrong hand');
            } else {
              if (pat.hand[b.from] !== 1 - b.hand) fail(tag + 'ball caught on the wrong side');
              if (pat.hand[b.to] !== b.hand) fail(tag + 'ball carried to a lane on the wrong side');
            }
            const was = prev.get(b.id);
            if (was) {
              if (was.state === 'roll' && b.state === 'carry' && b.from !== was.lane) fail(tag + 'ball ' + b.id + ' jumped lanes when caught');
              if (was.state === 'carry' && b.state === 'roll') {
                if (b.lane !== was.to) fail(tag + 'ball ' + b.id + ' jumped lanes when rolled');
                if (b.hand !== was.hand) fail(tag + 'ball ' + b.id + ' changed hands in mid-air');
                if (u > 0) rollOrder.push(b.lane);
              }
              if (was.state === 'roll' && b.state === 'roll' && (b.lane !== was.lane || b.p < was.p)) fail(tag + 'ball ' + b.id + ' moved wrongly in its lane');
              if (was.state === 'carry' && b.state === 'carry' && (b.from !== was.from || b.to !== was.to || b.p < was.p)) fail(tag + 'ball ' + b.id + ' moved wrongly in the hand');
            }
            prev.set(b.id, b);
          }
        }
        // the lanes must be rolled in the order of the pattern, whatever the ball count
        if (rollOrder.length < 2 * L) fail(tag + 'too few rolls seen');
        const want = new Map();
        pat.seq.forEach(l => want.set(l, (want.get(l) || 0) + 1));
        const got = new Map();
        const whole = Math.floor(rollOrder.length / L) * L;
        rollOrder.slice(0, whole).forEach(l => got.set(l, (got.get(l) || 0) + 1));
        for (const [lane, c] of want) if (got.get(lane) !== c * whole / L) fail(tag + 'lane ' + lane + ' rolled ' + got.get(lane) + ' times in ' + whole + ' rolls');
        if (n % 2) {
          // hands take turns, so the order seen must be the pattern itself from some starting beat
          const s = rollOrder.join(''), twice = text + text;
          let ok = false;
          for (let o = 0; o < L; o++) if (s.startsWith(twice.slice(o, o + L))) ok = true;
          if (!ok) fail(tag + 'rolls came in the order ' + s.slice(0, 2 * L));
        }
      }
    }
    /* ---------- zips ---------- */
    const expected = await (await fetch('zip-timings.json')).json();
    const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const place = pl => pl.lane ? 'L' + pl.lane : 'M' + pl.mid;
    let zipChecks = 0;
    const zipPatterns = Object.keys(expected);
    for (const text of zipPatterns) {
      const pat = JLS.parse(text);
      if (!pat.ok || !pat.zip) { fail('zip pattern ' + text + ' does not parse'); continue; }
      for (const n of [1, 2, 3, 4, 5]) {
        const tag = text + ' with ' + n + ': ';
        const plan = JLS.zipPlan(pat, n);
        if (!expected[text][n]) { if (plan) fail(tag + 'found a timing the search script did not'); continue; }
        if (!plan) { fail(tag + 'no timing found'); continue; }
        if (!same(plan.vals, expected[text][n])) fail(tag + 'timing ' + plan.vals + ' but the search script says ' + expected[text][n]);
        const tm = JLS.timing(n);
        const prev = new Map(), L = pat.seq.length, order = [];
        for (let k = 0; k * 0.01 < 3 * L + 6; k++) {
          const u = 0.0031 + k * 0.01;
          const bs = JLS.zipBalls(u, plan, tm), hs = JLS.zipHands(u, plan, tm);
          zipChecks++;
          if (bs.length !== n) { fail(tag + bs.length + ' balls at u=' + u); break; }
          if (new Set(bs.map(b => b.id)).size !== n || bs.some(b => !(b.id >= 0 && b.id < n))) { fail(tag + 'bad ball ids at u=' + u); break; }
          let bad = false;
          for (let h = 0; h < 2; h++) {
            const held = bs.filter(b => b.state === 'held' && b.hand === h);
            if (held.length > 1) { fail(tag + 'hand ' + h + ' holds ' + held.length + ' balls at u=' + u); bad = true; break; }
            if (hs[h].holding !== (held.length === 1)) { fail(tag + 'hand ' + h + ' and its ball disagree at u=' + u); bad = true; break; }
            if (held.length && (place(held[0].from) !== place(hs[h].from) || place(held[0].to) !== place(hs[h].to) || Math.abs(held[0].p - hs[h].p) > 1e-6)) { fail(tag + 'hand ' + h + ' is not where its ball is at u=' + u); bad = true; break; }
            if (!(hs[h].p >= -1e-9 && hs[h].p <= 1 + 1e-9)) { fail(tag + 'hand ' + h + ' progress ' + hs[h].p); bad = true; break; }
          }
          if (bad) break;
          // balls in one lane must stay in the order they were rolled
          const inLane = {};
          for (const b of bs) if (b.state === 'roll') (inLane[b.lane] = inLane[b.lane] || []).push(b);
          for (const b of bs) {
            const was = prev.get(b.id);
            if (b.state === 'roll' && pat.hand[b.lane] !== b.hand) fail(tag + 'lane rolled by the wrong hand');
            if (was) {
              if (was.state === 'roll' && b.state === 'held' && place(b.from) !== 'L' + was.lane) fail(tag + 'ball ' + b.id + ' jumped when caught');
              if (was.state === 'held' && b.state === 'roll') {
                if (place(was.to) !== 'L' + b.lane || was.hand !== b.hand) fail(tag + 'ball ' + b.id + ' jumped when rolled');
                order.push(b.lane);
              }
              if (was.state === 'held' && b.state === 'held' && was.hand !== b.hand) {
                if (place(was.to) !== place(b.from) || !b.from.mid) fail(tag + 'ball ' + b.id + ' changed hands away from a zip');
                order.push('z');
              }
              if (was.state === 'roll' && b.state === 'roll' && (b.lane !== was.lane || b.p < was.p)) fail(tag + 'ball ' + b.id + ' moved wrongly in its lane');
              if (was.state === 'roll' && b.state === 'roll') {
                for (const o of inLane[b.lane]) { const ow = prev.get(o.id); if (o !== b && ow && ow.state === 'roll' && ow.lane === b.lane && (ow.p - was.p) * (o.p - b.p) < 0) fail(tag + 'a ball overtook another in lane ' + b.lane); }
              }
            }
            prev.set(b.id, b);
          }
        }
        // throws must come in the order of the pattern, zips included
        const got = order.join(''), twice = text + text;
        let ok = false;
        for (let o = 0; o < L; o++) if (got.startsWith(twice.slice(o, o + L))) ok = true;
        if (!ok) fail(tag + 'throws came in the order ' + got.slice(0, 2 * L));
      }
    }
    // with no zips, the zip engine must agree with the ordinary one
    for (const text of ['1234', '121434', '12341432', '1234565432']) {
      const pat = JLS.parse(text);
      for (const n of [1, 3, 5, 7, 9]) {
        const plan = JLS.zipPlan(pat, n), tm = JLS.timing(n);
        if (!plan || plan.vals.some(v => v !== n)) { fail(text + ' with ' + n + ': plain pattern got timing ' + (plan && plan.vals)); continue; }
        for (let k = 0; k < 400; k++) {
          const u = 0.0017 + k * 0.037;
          const a = JLS.balls(u, pat, n, tm).map(b => b.state === 'roll' ? 'r' + b.lane + b.hand + b.p.toFixed(5) : 'h' + b.hand + 'L' + b.from + 'L' + b.to + b.p.toFixed(5)).sort();
          const b2 = JLS.zipBalls(u, plan, tm).map(b => b.state === 'roll' ? 'r' + b.lane + b.hand + b.p.toFixed(5) : 'h' + b.hand + place(b.from) + place(b.to) + b.p.toFixed(5)).sort();
          if (!same(a, b2)) { fail(text + ' with ' + n + ': the two engines disagree at u=' + u); break; }
        }
      }
    }
    if (JLS.parse('12z').ok || JLS.parse('zz').ok || !JLS.parse('121Z').ok) fail('zip parsing rules');
    /* ---------- two people ---------- */
    const lists = new Function(html.match(/<script id="pair-patterns">([\s\S]*?)<\/script>/)[1] + '; return {PAIR_LIST: PAIR_LIST, ALL_PAIRS: ALL_PAIRS};')();
    const pairTexts = [];
    for (const k of Object.keys(lists.ALL_PAIRS)) for (const b of Object.keys(lists.ALL_PAIRS[k])) pairTexts.push(...lists.ALL_PAIRS[k][b].split(' '));
    for (const g of lists.PAIR_LIST) for (const it of g.items) if (!pairTexts.includes(it[1])) fail('listed pair pattern ' + it[1] + ' is not in the full list');
    let twoChecks = 0;
    // every held ball must be in exactly one hand at its end, moving along the same path, and no hand may hold a ball that isn't there
    function checkHands(tag, u, bs, hs) {
      const held = bs.filter(b => b.state === 'carry');
      const busy = hs.filter(h => h.holding);
      if (hs.length !== 4) return fail(tag + hs.length + ' hands'), false;
      if (held.length !== busy.length) return fail(tag + held.length + ' held balls but ' + busy.length + ' busy hands at u=' + u), false;
      const taken = new Set();
      for (const b of held) {
        const h = busy.findIndex((x, j) => !taken.has(j) && x.end === b.hand && x.from === b.from && x.to === b.to && Math.abs(x.p - b.p) < 1e-6);
        if (h === -1) return fail(tag + 'a held ball has no hand at u=' + u), false;
        taken.add(h);
      }
      for (const h of hs) if (!(h.p >= -1e-9 && h.p <= 1 + 1e-9) || h.from === h.to) return fail(tag + 'hand moving wrongly at u=' + u), false;
      return true;
    }
    for (const text of pairTexts) {
      const pat = JLS.parse(text);
      if (!pat.ok || !pat.pairs) { fail('pair pattern ' + text + ' does not parse: ' + pat.error); continue; }
      for (const m of [1, 2, 3, 4]) {
        const tag = text + ' with ' + 2 * m + ': ', tm = JLS.timing(m), L = pat.seq.length;
        const last = [new Map(), new Map()];
        for (let k = 0; k * 0.013 < 2 * L + 3; k++) {
          const u = 0.0031 + k * 0.013;
          const bs = JLS.pairBalls(u, pat, m, tm), hs = JLS.pairHands(u, pat, m, tm);
          twoChecks++;
          if (bs.length !== 2 * m || new Set(bs.map(b => b.id)).size !== 2 * m) { fail(tag + 'wrong balls at u=' + u); break; }
          const rolling = bs.filter(b => b.state === 'roll');
          if (new Set(rolling.map(b => b.lane + ':' + b.p.toFixed(6))).size !== rolling.length) { fail(tag + 'two balls on top of each other at u=' + u); break; }
          if (!checkHands(tag, u, bs, hs)) break;
          // each hand must carry on from where it was
          let jump = false;
          for (const h of hs) {
            const was = last[h.end].get(h.which);
            if (was && was.holding && !h.holding && was.to !== h.from) jump = true;
            if (was && !was.holding && h.holding && was.to !== h.from) jump = true;
            last[h.end].set(h.which, h);
          }
          if (jump) { fail(tag + 'a hand jumped at u=' + u); break; }
        }
      }
    }
    for (const [name, text] of patterns) {
      const pat = JLS.parse(text);
      for (let n = 1; n <= JLS.MAX_BALLS; n++) {
        const tag = text + ' two people with ' + n + ': ', tm = JLS.timing(n), L = pat.seq.length;
        const last = [new Map(), new Map()];
        for (let k = 0; k * 0.013 < 2 * L + 3; k++) {
          const u = 0.0031 + k * 0.013;
          const hs = JLS.hands2(u, pat, n, tm);
          twoChecks++;
          if (!checkHands(tag, u, JLS.balls(u, pat, n, tm), hs)) break;
          let jump = false;
          for (const h of hs) {
            const was = last[h.end].get(h.which);
            if (was && was.holding !== h.holding && was.to !== h.from) jump = true;
            last[h.end].set(h.which, h);
          }
          if (jump) { fail(tag + 'a hand jumped at u=' + u); break; }
        }
      }
    }
    for (const bad of ['[14]', '[11][23]', '[14][21]', '1[23]4', '[14][23', '[147][23]']) if (JLS.parse(bad).ok) fail('"' + bad + '" should be refused');
    lines.push(pairTexts.length + ' two-at-once patterns, ' + twoChecks + ' moments checked');
    lines.push(zipPatterns.length + ' zip patterns, ' + zipChecks + ' moments checked');
    lines.push(failures ? failures + ' FAILURES' : 'ALL PASSED');
    lines.push(patterns.length + ' patterns, ' + checks + ' moments checked');
  } catch (e) {
    lines.push('ERROR ' + e.message);
  }
  out.textContent = lines.join('\n');
  document.title = 'done';
})();
</script>
